spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monitor}
    username: ${DB_USER:monitor}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog.xml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 20000
app:
  auth:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:api-monitor}
    audience: ${JWT_AUDIENCE:monitor-ui}
  monitor:
    url: ${MONITOR_URL:https://api.frankfurter.dev/v2/rates?base=EUR&quotes=USD,GBP,CHF}
server:
  error:
    include-message: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
